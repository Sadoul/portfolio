<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f2e9" />
<title>Портфолио · Скетч</title>
<meta name="description" content="Портфолио: Web, Minecraft, Game Development, Биография. Скетч-стиль, чёрно-белый." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E" />
</head>
<body>

<svg class="filters" aria-hidden="true">
  <defs>
    <filter id="rough">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.03" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-hard">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="2" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<header class="topbar">
  <div class="brand">
    <img class="avatar" src="assets/web/me.webp" alt="аватар" width="44" height="44" />
    <div class="logo">портфолио.</div>
  </div>

  <div class="lang" id="langSwitch" role="group" aria-label="Язык / Language">
    <button class="lang-btn" data-lang="ru" aria-pressed="true" title="Русский">
      <svg class="flag" viewBox="0 0 60 40" aria-hidden="true">
        <rect width="60" height="40" fill="#fff"/>
        <rect y="13.33" width="60" height="13.34" fill="#0039A6"/>
        <rect y="26.67" width="60" height="13.33" fill="#D52B1E"/>
      </svg><span>RU</span>
    </button>
    <button class="lang-btn" data-lang="en" aria-pressed="false" title="English">
      <svg class="flag" viewBox="0 0 60 40" aria-hidden="true">
        <rect width="60" height="40" fill="#012169"/>
        <path d="M0 0 L60 40 M60 0 L0 40" stroke="#fff" stroke-width="7"/>
        <path d="M0 0 L60 40 M60 0 L0 40" stroke="#C8102E" stroke-width="2.4"/>
        <rect x="22" width="16" height="40" fill="#fff"/>
        <rect y="11" width="60" height="18" fill="#fff"/>
        <rect x="25" width="10" height="40" fill="#C8102E"/>
        <rect y="14" width="60" height="12" fill="#C8102E"/>
      </svg><span>EN</span>
    </button>
  </div>
</header>

<main class="stage">

  <!-- ГЕРОЙ-БАРАБАН: прямозубая шестерня 3/4, крутится (слабо холостым, сильно при скролле) -->
  <section class="hero" aria-label="Барабан-навигация">
    <div class="hero-gear" id="heroGear" aria-hidden="true"></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="Разделы">
    <button class="tab-arrow" id="arrowLeft" aria-label="Назад">
      <svg viewBox="0 0 40 40"><path d="M27 7 L13 20 L27 33" class="ink-stroke"/></svg>
    </button>
    <div class="tab-strip" id="tabStrip"></div>
    <button class="tab-arrow" id="arrowRight" aria-label="Вперёд">
      <svg viewBox="0 0 40 40"><path d="M13 7 L27 20 L13 33" class="ink-stroke"/></svg>
    </button>
  </nav>

  <p class="tab-sub" id="tabSub">—</p>

  <section class="content" id="content" aria-live="polite"></section>

</main>

<footer class="footer">
  <span class="footer-line"></span>
  <a class="footer-tg" href="https://t.me/Nichtojestv0" target="_blank" rel="noopener">TG — @Nichtojestv0</a>
</footer>

<!-- переход-свап при смене языка -->
<div class="swap" id="swap" aria-hidden="true">
  <div class="swap__text" id="swapText"></div>
</div>

<!-- боковая декоративная шестерёнка (слабо крутится + сильно при скролле) -->
<div class="side-gear" id="drumGear" aria-hidden="true"></div>

<script src="https://unpkg.com/three@0.137.0/build/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
